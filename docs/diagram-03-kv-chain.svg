<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1010" viewBox="0 0 1380 1010" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ch" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3E4C59"/>
    </marker>
  </defs>
  <rect width="1380" height="1010" fill="#ffffff"/>

  <text x="690" y="50" text-anchor="middle" font-size="33" font-weight="700" fill="#17242E">Key Vault → Gateway listener: the four silent failures</text>
  <text x="690" y="86" text-anchor="middle" font-size="18" fill="#5A6270">Every one of these fails without an error anywhere you are looking.</text>

  <!-- CHAIN -->
  <rect x="120" y="130" width="500" height="92" rx="12" fill="#EFF6FC" stroke="#0078D4" stroke-width="2.5"/>
  <text x="370" y="165" text-anchor="middle" font-size="20" font-weight="700" fill="#0B4E8A">Azure Key Vault</text>
  <text x="370" y="196" text-anchor="middle" font-size="16" fill="#26404F">cert-app1  (PFX: public cert + private key)</text>

  <line x1="370" y1="222" x2="370" y2="322" stroke="#3E4C59" stroke-width="3" marker-end="url(#ch)"/>

  <rect x="120" y="330" width="500" height="118" rx="12" fill="#F6F3FF" stroke="#6B4FBB" stroke-width="2.5"/>
  <text x="370" y="364" text-anchor="middle" font-size="20" font-weight="700" fill="#4B2E9E">Secrets Store CSI Driver</text>
  <text x="370" y="394" text-anchor="middle" font-size="16" fill="#5A5270">SecretProviderClass  kv-app1</text>
  <text x="370" y="424" text-anchor="middle" font-size="16" fill="#5A5270">runs on the nodes, as a managed identity</text>

  <line x1="370" y1="448" x2="370" y2="548" stroke="#3E4C59" stroke-width="3" marker-end="url(#ch)"/>

  <rect x="120" y="556" width="500" height="98" rx="12" fill="#F1F9F3" stroke="#1E7B34" stroke-width="2.5"/>
  <text x="370" y="590" text-anchor="middle" font-size="20" font-weight="700" fill="#146C2E">Secret  tls-app1</text>
  <text x="370" y="622" text-anchor="middle" font-size="16" fill="#26404F">type: kubernetes.io/tls   ·   ns: app1</text>

  <line x1="370" y1="654" x2="370" y2="752" stroke="#3E4C59" stroke-width="3" marker-end="url(#ch)"/>

  <rect x="120" y="760" width="500" height="98" rx="12" fill="#EFF6FF" stroke="#1565C0" stroke-width="2.5"/>
  <text x="370" y="794" text-anchor="middle" font-size="20" font-weight="700" fill="#0B4E8A">Gateway listener</text>
  <text x="370" y="826" text-anchor="middle" font-size="16" fill="#26404F">certificateRefs → tls-app1   ·   ns: gw</text>

  <!-- markers on chain -->
  <circle cx="315" cy="272" r="19" fill="#C62828"/><text x="315" y="279" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text>
  <circle cx="425" cy="272" r="19" fill="#C62828"/><text x="425" y="279" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text>
  <circle cx="370" cy="498" r="19" fill="#C62828"/><text x="370" y="505" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text>
  <circle cx="620" cy="580" r="19" fill="#C62828"/><text x="620" y="587" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">4</text>

  <!-- CALLOUTS -->
  <rect x="686" y="128" width="654" height="126" rx="12" fill="#FFF5F5" stroke="#E57373" stroke-width="2"/>
  <circle cx="718" cy="158" r="17" fill="#C62828"/><text x="718" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text>
  <text x="744" y="165" font-size="17" font-weight="700" fill="#8C1D18">NETWORK — the vault is not reachable from the nodes</text>
  <text x="708" y="196" font-size="14.5" font-style="italic" fill="#5A6270">"Public network access is disabled ... ForbiddenByConnection"</text>
  <text x="708" y="224" font-size="14.5" fill="#26404F">Fix: Private Endpoint into the node subnet + private DNS zone</text>
  <text x="708" y="244" font-size="14.5" fill="#26404F">linked to the AKS VNet. A modify policy may block public access.</text>

  <rect x="686" y="272" width="654" height="126" rx="12" fill="#FFF5F5" stroke="#E57373" stroke-width="2"/>
  <circle cx="718" cy="302" r="17" fill="#C62828"/><text x="718" y="309" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
  <text x="744" y="309" font-size="17" font-weight="700" fill="#8C1D18">IDENTITY — the clientId changed underneath you</text>
  <text x="708" y="340" font-size="14.5" font-style="italic" fill="#5A6270">RESPONSE 400: "Identity not found"  (IMDS 169.254.169.254)</text>
  <text x="708" y="368" font-size="14.5" fill="#26404F">Keeps working until a Pod restarts — then ContainerCreating forever.</text>
  <text x="708" y="388" font-size="14.5" fill="#26404F">Fix: never hardcode userAssignedIdentityID. Template + reconcile it.</text>

  <rect x="686" y="440" width="654" height="126" rx="12" fill="#FFF5F5" stroke="#E57373" stroke-width="2"/>
  <circle cx="718" cy="470" r="17" fill="#C62828"/><text x="718" y="477" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text>
  <text x="744" y="477" font-size="17" font-weight="700" fill="#8C1D18">MOUNT — no Pod mounts it, so no Secret exists</text>
  <text x="708" y="508" font-size="14.5" font-style="italic" fill="#5A6270">Listener reports ResolvedRefs=False. Envoy never gets a cert.</text>
  <text x="708" y="536" font-size="14.5" fill="#26404F">CSI is a volume driver: the Secret is a side effect of a mount, and is</text>
  <text x="708" y="556" font-size="14.5" fill="#26404F">GC'd with the last mounting Pod. Fix: a pause-container syncer Deployment.</text>

  <rect x="686" y="584" width="654" height="126" rx="12" fill="#FFF5F5" stroke="#E57373" stroke-width="2"/>
  <circle cx="718" cy="614" r="17" fill="#C62828"/><text x="718" y="621" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">4</text>
  <text x="744" y="621" font-size="17" font-weight="700" fill="#8C1D18">ROTATION — it is off by default</text>
  <text x="708" y="652" font-size="14.5" font-style="italic" fill="#5A6270">enableSecretRotation: "false"   (next to a reassuring 2m poll interval)</text>
  <text x="708" y="680" font-size="14.5" fill="#26404F">The renewed cert sits in Key Vault; the cluster serves the old one until</text>
  <text x="708" y="700" font-size="14.5" fill="#26404F">it expires. Fix: az aks update --enable-secret-rotation</text>

  <!-- bottom note -->
  <rect x="686" y="750" width="654" height="124" rx="12" fill="#FFF8E1" stroke="#B8860B" stroke-width="2"/>
  <text x="708" y="784" font-size="17" font-weight="700" fill="#7A5B00">Bonus: objectType: secret — not certificate</text>
  <text x="708" y="814" font-size="14.5" fill="#26404F">In Key Vault the private key is only retrievable from the secret endpoint.</text>
  <text x="708" y="836" font-size="14.5" fill="#26404F">Ask for "certificate" and you get a public cert with no key, and a TLS</text>
  <text x="708" y="858" font-size="14.5" fill="#26404F">error that never mentions the cause.</text>

  <text x="690" y="928" text-anchor="middle" font-size="18" fill="#3E4C59">Three of the four keep working perfectly until something restarts. That is what makes them expensive.</text>
  <text x="690" y="966" text-anchor="middle" font-size="16" font-style="italic" fill="#5A6270">Check with: kubectl get gateway &lt;name&gt; -n &lt;ns&gt; -o jsonpath='{.status.listeners[*].conditions}'</text>
</svg>
