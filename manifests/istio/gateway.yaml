# Gateway for AKS managed Gateway API (App Routing + Istio).
# Uses GatewayClass: approuting-istio
#
# IMPORTANT: With approuting-istio, the Gateway must live in the SAME namespace
# as the TLS secrets it references (Istio's listener tls.certificateRefs is
# namespace-scoped). To keep one Gateway with 3 listeners + 3 certs, we put
# the cert secrets together in the gateway's namespace by syncing them there.
#
# In this POC we deploy the Gateway in namespace "gw" and reference the same
# tls-* secrets that already live in app1/app2/app3 namespaces, exposed via
# ReferenceGrants.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: __GW__
  namespace: __NS_GW__
spec:
  # Annotations placed here propagate to the auto-provisioned Service that
  # fronts the Istio data plane (i.e. the cloud LoadBalancer). This is how
  # we flip the Gateway between a public and an internal (private IP) LB.
  infrastructure:
    annotations:
__INFRA_ANNOTATIONS__
  gatewayClassName: approuting-istio
  listeners:
    - name: app1-https
      protocol: HTTPS
      port: 443
      hostname: __HOST_APP1__
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            namespace: __NS_APP1__
            name: tls-app1
      allowedRoutes:
        namespaces: { from: All }
    - name: app2-https
      protocol: HTTPS
      port: 443
      hostname: __HOST_APP2__
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            namespace: __NS_APP2__
            name: tls-app2
      allowedRoutes:
        namespaces: { from: All }
    - name: dev-wildcard-https
      protocol: HTTPS
      port: 443
      hostname: "__HOST_WILDCARD__"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            namespace: __NS_APP3__
            name: tls-app3
      allowedRoutes:
        namespaces: { from: All }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: app1-route, namespace: __NS_APP1__ }
spec:
  parentRefs: [{ name: __GW__, namespace: __NS_GW__, sectionName: app1-https }]
  hostnames: ["__HOST_APP1__"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: app1, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: app2-route, namespace: __NS_APP2__ }
spec:
  parentRefs: [{ name: __GW__, namespace: __NS_GW__, sectionName: app2-https }]
  hostnames: ["__HOST_APP2__"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: app2, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: app3-route, namespace: __NS_APP3__ }
spec:
  parentRefs: [{ name: __GW__, namespace: __NS_GW__, sectionName: dev-wildcard-https }]
  hostnames: ["__HOST_APP3__"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: app3, port: 80 }]
---
# ReferenceGrants — Gateway in 'gw' ns references Secrets in app1/app2/app3.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: { name: gw-to-app1, namespace: __NS_APP1__ }
spec:
  from: [{ group: gateway.networking.k8s.io, kind: Gateway, namespace: __NS_GW__ }]
  to:   [{ group: "",                         kind: Secret }]
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: { name: gw-to-app2, namespace: __NS_APP2__ }
spec:
  from: [{ group: gateway.networking.k8s.io, kind: Gateway, namespace: __NS_GW__ }]
  to:   [{ group: "",                         kind: Secret }]
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: { name: gw-to-app3, namespace: __NS_APP3__ }
spec:
  from: [{ group: gateway.networking.k8s.io, kind: Gateway, namespace: __NS_GW__ }]
  to:   [{ group: "",                         kind: Secret }]
